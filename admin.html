<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><title>הזנת תוצאות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b1e;--card:#1b1738;--line:#2b2552;--tx:#f4f2ff;--mut:#9d98c4;--pink:#ff2e93;--yel:#ffd23f;--grn:#2ee59d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:14px 14px 120px;user-select:none}
h1{font-size:20px;font-weight:900;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.st{font-size:12px;font-weight:700;color:var(--grn)}.st.off{color:var(--pink)}
.pl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px}
.pl.lead{border-color:rgba(255,210,63,.7)}
.nm{grid-column:1/-1;font-weight:800;font-size:17px;padding:0 4px;display:flex;justify-content:space-between}
.nm span{color:var(--mut);font-size:13px;font-weight:500}
.v{font-size:56px;font-weight:900;text-align:center;min-width:90px;font-variant-numeric:tabular-nums;color:var(--yel)}
button{font:inherit;border:0;color:var(--tx);cursor:pointer}
.b{height:72px;border-radius:16px;font-size:34px;font-weight:900}
.plus{background:var(--pink)}.minus{background:#2b2552}.b:active{transform:scale(.95)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(13,11,30,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar button{flex:1;height:54px;border-radius:14px;font-weight:800;font-size:16px;background:var(--card);border:1px solid var(--line)}
.bar .go{background:var(--grn);color:#0d0b1e;flex:2}
.sheet{position:fixed;inset:0;background:rgba(5,4,15,.85);display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}
.sc{background:#15122e;width:100%;border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.sc h2{font-size:18px;margin-bottom:12px;text-align:center}
.sc button{display:block;width:100%;height:56px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;font-size:18px;font-weight:800}
.sc button.top{border-color:var(--yel)}
h3{font-size:14px;color:var(--mut);margin:18px 2px 8px}
.h{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.h.u{opacity:.4;text-decoration:line-through}.h small{color:var(--mut);display:block;font-size:12px}
.h button{background:#2b2552;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700}
#gate{display:none;padding-top:60px;text-align:center}#gate input{width:100%;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:18px;text-align:center;margin:14px 0}
#gate button{width:100%;height:54px;border-radius:14px;background:var(--pink);font-weight:800;font-size:17px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.2s;z-index:20}.toast.on{opacity:1}
</style></head><body>
<div id="gate"><h1 style="justify-content:center">הזנת תוצאות</h1><p style="color:var(--mut)">הכנס קוד גישה</p><input id="kin" type="password" autocomplete="off"><button id="kgo">כניסה</button></div>
<div id="app" style="display:none">
<h1><span>משחק חי</span><span class="st" id="st">● מחובר</span></h1>
<div id="pls"></div>
<h3>משחקים אחרונים</h3><div id="hist"></div>
</div>
<div class="bar" id="bar" style="display:none"><button id="undo">↩ בטל</button><button id="reset">אפס</button><button class="go" id="fin">סיים משחק</button></div>
<div class="sheet" id="sheet"><div class="sc"><h2>מי ניצח?</h2><div id="opts"></div><button id="cancel" style="background:none">ביטול</button></div></div>
<div class="toast" id="toast"></div>
<script>
const FS="https://firestore.googleapis.com/v1/projects/israel-hit-league/databases/(default)/documents/pub/state";
let S={live:{on:false,pts:[0,0,0,0,0]},events:{}};window.__busy=0;
const NAMES=["מיכל רפופורט קסטן","נימרוד שי","לוטן שי","סתיו שי נוריאל","זיו קסטן"];
let K=(location.hash.match(/k=([A-Za-z0-9]+)/)||[])[1]||localStorage.getItem("hk");
if(location.hash)history.replaceState(null,"",location.pathname);
let pts=[0,0,0,0,0],on=false,EV={},stack=[];
const $=id=>document.getElementById(id);
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1200)};
const nonce=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
async function write(fn){
 fn(S);window.__busy++;
 try{const r=await fetch(FS+"?updateMask.fieldPaths=j&updateMask.fieldPaths=k",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{j:{stringValue:JSON.stringify(S)},k:{stringValue:K}}})});
  if(!r.ok){$("st").textContent="● שגיאה";$("st").className="st off";toast(r.status==403?"קוד שגוי":"שגיאה בשמירה");return false}
  $("st").textContent="● מחובר";$("st").className="st";return true}catch(e){$("st").textContent="● אין חיבור";$("st").className="st off";return false}finally{window.__busy--}
}
function draw(){
 const mx=Math.max(...pts);
 $("pls").innerHTML=NAMES.map((n,i)=>`<div class="pl ${mx>0&&pts[i]===mx?"lead":""}"><div class="nm">${n}</div><button class="b minus" data-m="${i}">−</button><div class="v">${pts[i]}</div><button class="b plus" data-p="${i}">+</button></div>`).join("");
 const ids=Object.keys(EV).filter(k=>EV[k]&&EV[k].pts).sort((a,b)=>EV[b].t-EV[a].t).slice(0,8);
 $("hist").innerHTML=ids.map(k=>{const e=EV[k];return `<div class="h ${e.u?"u":""}"><div><b>${NAMES[+e.w]}</b><small>${e.pts.join(" · ")}</small></div><button data-u="${k}" data-s="${e.u?0:1}">${e.u?"שחזר":"בטל"}</button></div>`}).join("")||'<div class="h" style="color:var(--mut)">עדיין אין משחקים</div>';
}
async function setPts(i,v){
 pts[i]=Math.max(0,v);on=true;draw();
 await write(()=>{S.live.on=true;S.live.pts[i]=pts[i]});
}
document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.p!==undefined){const i=+b.dataset.p;stack.push(i);if(navigator.vibrate)navigator.vibrate(15);setPts(i,pts[i]+1)}
 else if(b.dataset.m!==undefined){const i=+b.dataset.m;setPts(i,pts[i]-1)}
 else if(b.id==="undo"){const i=stack.pop();if(i===undefined)return toast("אין מה לבטל");setPts(i,pts[i]-1)}
 else if(b.id==="reset"){if(!confirm("לאפס את הניקוד של המשחק הנוכחי?"))return;pts=[0,0,0,0,0];stack=[];draw();write(()=>{S.live={on:false,pts:[0,0,0,0,0]}})}
 else if(b.id==="fin"){const mx=Math.max(...pts);$("opts").innerHTML=NAMES.map((n,i)=>`<button data-w="${i}" class="${pts[i]===mx&&mx>0?"top":""}">${n} (${pts[i]})</button>`).join("");$("sheet").classList.add("on")}
 else if(b.id==="cancel"){$("sheet").classList.remove("on")}
 else if(b.dataset.w!==undefined){
  const w=+b.dataset.w,id="g"+Date.now().toString(36);$("sheet").classList.remove("on");
  const fp=pts.slice();const ok=await write(()=>{S.events[id]={t:Date.now(),w:w,pts:fp};S.live={on:false,pts:[0,0,0,0,0]}});
  if(ok){toast("נשמר: "+NAMES[w]);pts=[0,0,0,0,0];stack=[];on=false;EV=S.events;draw()}
 }
 else if(b.dataset.u!==undefined){const k=b.dataset.u,s=b.dataset.s==="1";const ok=await write(()=>{if(S.events[k]){if(s)S.events[k].u=true;else delete S.events[k].u}});if(ok){toast(s?"המשחק בוטל":"המשחק שוחזר");EV=S.events;draw()}}
});
async function pull(){if(window.__busy)return;try{const r=await fetch(FS);if(!r.ok)return;const x=await r.json();const s=JSON.parse((x.fields&&x.fields.j&&x.fields.j.stringValue)||"{}");if(window.__busy)return;S={live:s.live||{on:false,pts:[0,0,0,0,0]},events:s.events||{}};if(!S.live.pts)S.live.pts=[0,0,0,0,0];EV=S.events;pts=[0,1,2,3,4].map(i=>+(S.live.pts[i]||0));draw()}catch(e){}}
function start(){$("gate").style.display="none";$("app").style.display="block";$("bar").style.display="flex";pull();
 setInterval(pull,4000);}
if(K){localStorage.setItem("hk",K);start()}else{$("gate").style.display="block";$("kgo").onclick=()=>{K=$("kin").value.trim();if(K){localStorage.setItem("hk",K);start()}}}
</script></body></html>
